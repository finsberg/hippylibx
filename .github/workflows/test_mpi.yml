name: Test package

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-code:
    name: Test on ${{ matrix.container }}
    runs-on: ubuntu-24.04
    container: ${{ matrix.container }}
    env:
      DEB_PYTHON_INSTALL_LAYOUT: deb_system

    strategy:
      fail-fast: false
      matrix:
        container: [
          # "ghcr.io/fenics/dolfinx/dolfinx:v0.9.0",
          "ghcr.io/fenics/dolfinx/dolfinx:stable",
          "ghcr.io/fenics/dolfinx/dolfinx:nightly"
        ]

    steps:
      - uses: actions/checkout@v5

      - name: Install package
        run: |
          python3 -m pip install .[test,demo]

      - name: Run tests
        run: |
          mpirun -n 2 python3 -m pytest -v tests/
